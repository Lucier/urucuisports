<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="Banner do Festival de Futebol Society">
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#052e16" stop-opacity="0.85"/>
      <stop offset="0.65" stop-color="#052e16" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#052e16" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Gramado listrado -->
  <rect width="1200" height="400" fill="#16a34a"/>
  <g fill="#15803d">
    <rect x="100" width="100" height="400"/>
    <rect x="300" width="100" height="400"/>
    <rect x="500" width="100" height="400"/>
    <rect x="700" width="100" height="400"/>
    <rect x="900" width="100" height="400"/>
    <rect x="1100" width="100" height="400"/>
  </g>
  <rect width="1200" height="400" fill="url(#shade)"/>

  <!-- Gol -->
  <g transform="translate(870 80)">
    <rect width="270" height="170" fill="#ffffff" fill-opacity="0.08"/>
    <g stroke="#ffffff" stroke-opacity="0.5" stroke-width="2">
      <line x1="45" y1="0" x2="45" y2="170"/>
      <line x1="90" y1="0" x2="90" y2="170"/>
      <line x1="135" y1="0" x2="135" y2="170"/>
      <line x1="180" y1="0" x2="180" y2="170"/>
      <line x1="225" y1="0" x2="225" y2="170"/>
      <line x1="0" y1="42" x2="270" y2="42"/>
      <line x1="0" y1="85" x2="270" y2="85"/>
      <line x1="0" y1="128" x2="270" y2="128"/>
    </g>
    <path d="M0 170 V0 H270 V170" fill="none" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
  </g>
  <line x1="780" y1="330" x2="1200" y2="330" stroke="#ffffff" stroke-opacity="0.6" stroke-width="6"/>

  <!-- Bola -->
  <g transform="translate(830 290)">
    <circle r="46" fill="#ffffff" stroke="#0f172a" stroke-width="4"/>
    <polygon points="0,-15 14.3,-4.6 8.8,12.1 -8.8,12.1 -14.3,-4.6" fill="#0f172a"/>
    <g stroke="#0f172a" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-15" x2="0" y2="-46"/>
      <line x1="14.3" y1="-4.6" x2="43.7" y2="-14.2"/>
      <line x1="8.8" y1="12.1" x2="27" y2="37.2"/>
      <line x1="-8.8" y1="12.1" x2="-27" y2="37.2"/>
      <line x1="-14.3" y1="-4.6" x2="-43.7" y2="-14.2"/>
    </g>
  </g>

  <!-- Texto -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700">
    <text x="80" y="125" font-size="26" letter-spacing="6" fill="#bbf7d0">VENHA JOGAR E TORCER</text>
    <text x="80" y="205" font-size="68" fill="#ffffff">FESTIVAL DE</text>
    <text x="80" y="280" font-size="68" fill="#fde047">FUTEBOL SOCIETY</text>
    <text x="80" y="342" font-size="24" letter-spacing="4" fill="#ffffff" fill-opacity="0.8">URUCUÍ SPORTS</text>
  </g>
</svg>
