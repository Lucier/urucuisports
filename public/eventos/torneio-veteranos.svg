<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="Banner do Torneio de Veteranos do Urucuiense">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Refletores -->
  <polygon points="760,0 880,0 1000,400 620,400" fill="url(#beam)"/>
  <polygon points="1080,0 1200,0 1200,400 1020,400" fill="url(#beam)"/>
  <g fill="#fde68a">
    <circle cx="790" cy="12" r="10"/>
    <circle cx="820" cy="12" r="10"/>
    <circle cx="850" cy="12" r="10"/>
    <circle cx="1110" cy="12" r="10"/>
    <circle cx="1140" cy="12" r="10"/>
    <circle cx="1170" cy="12" r="10"/>
  </g>

  <!-- Troféu -->
  <g transform="translate(60 0)">
    <g fill="none" stroke="url(#gold)" stroke-width="14" stroke-linecap="round">
      <path d="M900 130 H860 C860 190 880 212 912 218"/>
      <path d="M1060 130 H1100 C1100 190 1080 212 1048 218"/>
    </g>
    <path d="M895 105 H1065 V172 C1065 220 1028 252 980 252 C932 252 895 220 895 172 Z" fill="url(#gold)"/>
    <path d="M925 125 V170 C925 195 940 215 962 225" fill="none" stroke="#fff7d6" stroke-opacity="0.55" stroke-width="8" stroke-linecap="round"/>
    <rect x="966" y="250" width="28" height="48" fill="url(#gold)"/>
    <rect x="920" y="296" width="120" height="26" rx="6" fill="url(#gold)"/>
    <rect x="900" y="320" width="160" height="20" rx="6" fill="#b45309"/>
  </g>

  <!-- Texto -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700">
    <text x="80" y="125" font-size="26" letter-spacing="6" fill="#fcd34d">DO URUCUIENSE</text>
    <text x="80" y="205" font-size="76" fill="#ffffff">TORNEIO DE</text>
    <text x="80" y="282" font-size="76" fill="#fbbf24">VETERANOS</text>
    <text x="80" y="342" font-size="24" letter-spacing="4" fill="#ffffff" fill-opacity="0.7">URUCUÍ SPORTS</text>
  </g>
</svg>
