<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="Banner da Abertura da Copa Urucuí de Futsal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#065f46"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Quadra -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="6">
    <rect x="40" y="30" width="1120" height="340" rx="8"/>
    <line x1="600" y1="30" x2="600" y2="370"/>
    <circle cx="600" cy="200" r="70"/>
    <path d="M40 120 A80 80 0 0 1 120 200 A80 80 0 0 1 40 280"/>
    <path d="M1160 120 A80 80 0 0 0 1080 200 A80 80 0 0 0 1160 280"/>
  </g>

  <!-- Bola -->
  <g transform="translate(1020 200)">
    <circle r="90" fill="#ffffff" stroke="#0f172a" stroke-width="5"/>
    <polygon points="0,-30 28.5,-9.3 17.6,24.3 -17.6,24.3 -28.5,-9.3" fill="#0f172a"/>
    <g stroke="#0f172a" stroke-width="5" stroke-linecap="round">
      <line x1="0" y1="-30" x2="0" y2="-90"/>
      <line x1="28.5" y1="-9.3" x2="85.6" y2="-27.8"/>
      <line x1="17.6" y1="24.3" x2="52.9" y2="72.8"/>
      <line x1="-17.6" y1="24.3" x2="-52.9" y2="72.8"/>
      <line x1="-28.5" y1="-9.3" x2="-85.6" y2="-27.8"/>
    </g>
  </g>

  <!-- Texto -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700">
    <text x="80" y="125" font-size="26" letter-spacing="6" fill="#6ee7b7">ABERTURA OFICIAL</text>
    <text x="80" y="205" font-size="76" fill="#ffffff">COPA URUCUÍ</text>
    <text x="80" y="282" font-size="76" fill="#fbbf24">DE FUTSAL</text>
    <text x="80" y="342" font-size="24" letter-spacing="4" fill="#ffffff" fill-opacity="0.7">URUCUÍ SPORTS</text>
  </g>
</svg>
